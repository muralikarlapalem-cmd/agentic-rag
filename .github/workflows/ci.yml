name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agentic-rag:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name rag -p 8501:8501 \
            -e OPENAI_API_KEY=sk-dummy -e APP_PASSWORD=ci-only agentic-rag:ci
          for i in $(seq 1 40); do
            curl -fsS localhost:8501/_stcore/health && exit 0
            sleep 3
          done
          docker logs rag; exit 1

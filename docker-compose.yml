name: agentic-rag

services:
  app:
    build: .
    image: agentic-rag:latest
    env_file: .env
    restart: unless-stopped
    # Loopback only: reachable via Caddy (https profile) or an SSH tunnel, never directly.
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - rag-data:/data
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Public HTTPS front door. Enable with:  docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  rag-data:
  caddy-data:
  caddy-config:
